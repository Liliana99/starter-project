name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #icon
  ionicons: ^0.2.2

  #state management
  flutter_bloc: ^8.1.6

  #comparing dart objects
  equatable: ^2.0.8

  #service locator
  get_it: ^8.3.0
  
  #dateFormat
  intl: ^0.18.1

  #Database
  #floor: ^1.5.0
  #floor_annotation: ^1.5.0

  #make request to api
  retrofit: ^4.9.2

  # Firebase
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.1.0


  #Hooks
  flutter_hooks: ^0.18.6

  #chached image 
  cached_network_image: ^3.4.1

  #json
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
 
  #floor_generator: ^1.5.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0





flutter:

  uses-material-design: true

 
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
